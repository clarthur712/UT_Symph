<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Undertale Concert</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #000;
            color: #fff;

            font-family: Arial, sans-serif;

            touch-action: none;
        }

        /* =========================
           MAIN GAME SCREEN
        ========================= */

        #game-screen {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           LEFT CONTROL AREA
        ========================= */

        #left-control {
            width: 20vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           JOYSTICK
        ========================= */

        #joystick {
            width: 110px;
            height: 110px;

            border: 3px solid #555;
            border-radius: 50%;

            position: relative;

            background: rgba(255, 255, 255, 0.05);

            touch-action: none;
        }

        #joystick-stick {
            width: 48px;
            height: 48px;

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: #777;

            border: 2px solid #aaa;
        }


        /* =========================
           CENTER GAME AREA
        ========================= */

        #game-container {
            width: 60vw;

            aspect-ratio: 16 / 9;

            max-height: 90vh;

            background: #111;

            border: 3px solid #fff;

            position: relative;

            overflow: hidden;
        }


        /* =========================
           TEMPORARY GAME CONTENT
        ========================= */

        #heart {
            width: 18px;
            height: 18px;

            background: red;

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            /* temporary heart shape */
            clip-path: polygon(
                50% 100%,
                0% 35%,
                0% 15%,
                15% 0%,
                35% 0%,
                50% 20%,
                65% 0%,
                85% 0%,
                100% 15%,
                100% 35%
            );
        }


        /* =========================
           RIGHT CONTROL AREA
        ========================= */

        #right-control {
            width: 20vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           Z BUTTON
        ========================= */

        #z-button {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            border: 3px solid #fff;

            background: #111;

            color: #fff;

            font-size: 28px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;

            touch-action: manipulation;
        }

        #z-button:active {
            background: #fff;
            color: #000;
        }


        /* =========================
           PORTRAIT WARNING
        ========================= */

        #rotate-warning {
            display: none;

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            z-index: 9999;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        #rotate-warning-content {
            font-size: 20px;
            line-height: 1.6;
        }

        #rotate-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }


        /* =========================
           PORTRAIT MODE
        ========================= */

        @media screen and (orientation: portrait) {

            #rotate-warning {
                display: flex;
            }

        }


        /* =========================
           SMALL LANDSCAPE SCREEN
        ========================= */

        @media screen and (orientation: landscape) and (max-height: 450px) {

            #joystick {
                width: 90px;
                height: 90px;
            }

            #joystick-stick {
                width: 40px;
                height: 40px;
            }

            #z-button {
                width: 65px;
                height: 65px;

                font-size: 24px;
            }

            #game-container {
                max-height: 85vh;
            }

        }

    </style>
</head>


<body>

    <!-- =========================
         ROTATE PHONE WARNING
    ========================== -->

    <div id="rotate-warning">

        <div id="rotate-warning-content">

            <div id="rotate-icon">
                📱↻
            </div>

            Please rotate your phone<br>
            to landscape mode.

        </div>

    </div>


    <!-- =========================
         MAIN GAME SCREEN
    ========================== -->

    <div id="game-screen">


        <!-- LEFT -->

        <div id="left-control">

            <div id="joystick">

                <div id="joystick-stick"></div>

            </div>

        </div>


        <!-- CENTER -->

        <div id="game-container">

            <div id="heart"></div>

        </div>


        <!-- RIGHT -->

        <div id="right-control">

            <div id="z-button">
                Z
            </div>

        </div>

    </div>


    <script>

        /* =====================================
           VIRTUAL JOYSTICK
        ===================================== */

        const joystick = document.getElementById("joystick");
        const stick = document.getElementById("joystick-stick");

        let joystickActive = false;

        let joystickX = 0;
        let joystickY = 0;


        function moveJoystick(clientX, clientY) {

            const rect = joystick.getBoundingClientRect();

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let x = clientX - centerX;
            let y = clientY - centerY;


            const maxDistance =
                rect.width / 2 - stick.offsetWidth / 2;


            const distance = Math.sqrt(
                x * x + y * y
            );


            if (distance > maxDistance) {

                x = x / distance * maxDistance;
                y = y / distance * maxDistance;

            }


            stick.style.left =
                `calc(50% + ${x}px)`;

            stick.style.top =
                `calc(50% + ${y}px)`;


            joystickX = x / maxDistance;
            joystickY = y / maxDistance;


            console.log(
                "Joystick:",
                joystickX.toFixed(2),
                joystickY.toFixed(2)
            );
        }


        function resetJoystick() {

            joystickActive = false;

            stick.style.left = "50%";
            stick.style.top = "50%";

            joystickX = 0;
            joystickY = 0;

        }


        /* TOUCH */

        joystick.addEventListener(
            "touchstart",
            function(event) {

                joystickActive = true;

                const touch = event.touches[0];

                moveJoystick(
                    touch.clientX,
                    touch.clientY
                );

            },
            { passive: false }
        );


        joystick.addEventListener(
            "touchmove",
            function(event) {

                if (!joystickActive)
                    return;

                event.preventDefault();

                const touch = event.touches[0];

                moveJoystick(
                    touch.clientX,
                    touch.clientY
                );

            },
            { passive: false }
        );


        joystick.addEventListener(
            "touchend",
            function() {

                resetJoystick();

            }
        );


        /* MOUSE
           Useful for testing on PC
        */

        joystick.addEventListener(
            "mousedown",
            function(event) {

                joystickActive = true;

                moveJoystick(
                    event.clientX,
                    event.clientY
                );

            }
        );


        window.addEventListener(
            "mousemove",
            function(event) {

                if (!joystickActive)
                    return;

                moveJoystick(
                    event.clientX,
                    event.clientY
                );

            }
        );


        window.addEventListener(
            "mouseup",
            function() {

                resetJoystick();

            }
        );


        /* =====================================
           Z BUTTON
        ===================================== */

        const zButton =
            document.getElementById("z-button");


        zButton.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                console.log("Z button pressed");

            },
            { passive: false }
        );


        zButton.addEventListener(
            "click",
            function() {

                console.log("Z button pressed");

            }
        );

    </script>

</body>
</html>
