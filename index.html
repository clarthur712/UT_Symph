<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Important for mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Undertale Concert</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-screen {
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 20px;
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 60px;
        }

        .heart {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .enter-button {
            background: none;
            border: 2px solid white;
            color: white;
            padding: 12px 35px;
            font-size: 20px;
            cursor: pointer;
        }

        .enter-button:active {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <div class="title-screen">

        <h1>UNDERTALE</h1>

        <div class="subtitle">
            CONCERT 2026
        </div>

        <div class="heart">
            ♥
        </div>

        <button class="enter-button" onclick="location.href='UT_Symph.html'">
            ENTER
        </button>

    </div>

</body>
</html>
